name: Deploy development
run-name: Deploy development (${{ github.sha }})

# A reviewed Dev manifest or shared deployment-code change starts this workflow.
# Operators can also start a reconciliation manually from the Actions UI.
on:
  push:
    branches:
      - main
    paths:
      - environments/dev/deployment.env
      - infrastructure/deployment/**
      - infrastructure/networking/**
      - integrations/dynatrace/**
      - cloudbuild/cloudbuild-deploy.yaml
  workflow_dispatch:

# OIDC permission is used only to obtain short-lived Google credentials.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    # Require main for automatic and manual runs, matching the WIF trust condition.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit development deployment to Cloud Build
        # Map optional integration and management settings to Cloud Build inputs.
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_BUILD_SOURCE_BUCKET: ${{ vars.GCP_BUILD_SOURCE_BUCKET }}
          CLOUD_BUILD_SERVICE_ACCOUNT: ${{ vars.CLOUD_BUILD_SERVICE_ACCOUNT }}
          GCP_ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          TEARDOWN_DELAY_SECONDS: ${{ vars.TEARDOWN_DELAY_SECONDS || '600' }}
          DYNATRACE_ENABLED: ${{ vars.DYNATRACE_ENABLED || 'false' }}
          DYNATRACE_ENVIRONMENT_URL: ${{ vars.DYNATRACE_ENVIRONMENT_URL || 'disabled' }}
          DYNATRACE_TOKEN_SECRET: ${{ vars.DYNATRACE_TOKEN_SECRET || 'disabled' }}
          DYNATRACE_RUNTIME_SERVICE_ACCOUNT: ${{ vars.DYNATRACE_RUNTIME_SERVICE_ACCOUNT || 'disabled' }}
          DYNATRACE_MONITORING_MODE: ${{ vars.DYNATRACE_MONITORING_MODE || 'fullstack' }}
          DYNATRACE_HOST_GROUP: ${{ vars.DYNATRACE_HOST_GROUP || 'gcp-windows-demo' }}
          DYNATRACE_NETWORK_ZONE: ${{ vars.DYNATRACE_NETWORK_ZONE || 'disabled' }}
          MANAGEMENT_STATION_ENABLED: ${{ vars.DEV_MANAGEMENT_STATION_ENABLED || 'false' }}
        run: |
          # Keep this command synchronous so the GitHub run remains active until
          # deployment validation, viewing window, and teardown have completed.
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set the GCP_PROJECT_ID repository variable}"
          : "${GCP_BUILD_SOURCE_BUCKET:?Set the GCP_BUILD_SOURCE_BUCKET repository variable}"
          : "${CLOUD_BUILD_SERVICE_ACCOUNT:?Set the CLOUD_BUILD_SERVICE_ACCOUNT repository variable}"
          echo "Submitting development deployment to Cloud Build; GitHub Actions will wait for its final status."
          gcloud builds submit . \
            --project="$GCP_PROJECT_ID" \
            --region=global \
            --polling-interval=10 \
            --gcs-source-staging-dir="gs://${GCP_BUILD_SOURCE_BUCKET}/source" \
            --service-account="projects/${GCP_PROJECT_ID}/serviceAccounts/${CLOUD_BUILD_SERVICE_ACCOUNT}" \
            --config=cloudbuild/cloudbuild-deploy.yaml \
            --substitutions="_ZONE=${GCP_ZONE},_APP_NAME=dev-iis-demo,_DEPLOYMENT_MANIFEST=environments/dev/deployment.env,_TEARDOWN_DELAY_SECONDS=${TEARDOWN_DELAY_SECONDS},_DYNATRACE_ENABLED=${DYNATRACE_ENABLED},_DYNATRACE_ENVIRONMENT_URL=${DYNATRACE_ENVIRONMENT_URL},_DYNATRACE_TOKEN_SECRET=${DYNATRACE_TOKEN_SECRET},_DYNATRACE_RUNTIME_SERVICE_ACCOUNT=${DYNATRACE_RUNTIME_SERVICE_ACCOUNT},_DYNATRACE_MONITORING_MODE=${DYNATRACE_MONITORING_MODE},_DYNATRACE_HOST_GROUP=${DYNATRACE_HOST_GROUP},_DYNATRACE_NETWORK_ZONE=${DYNATRACE_NETWORK_ZONE},_MANAGEMENT_STATION_ENABLED=${MANAGEMENT_STATION_ENABLED}"

      - name: Report GitHub Actions conclusion
        # Report deployment result and persistent management-station access details.
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          MANAGEMENT_STATION_ENABLED: ${{ vars.DEV_MANAGEMENT_STATION_ENABLED || 'false' }}
        run: |
          {
            echo "## Development deployment conclusion"
            echo
            echo "- **Project:** Development (\`dev-iis-demo\`)"
            echo "- **GCP project:** ${GCP_PROJECT_ID:-not configured}"
            echo "- **Build/deployment result:** ${JOB_STATUS}"
            echo "- **GitHub run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "> **Persistent infrastructure:** The Dev load balancer, forwarding address, health check, and firewall rule remain after worker teardown and may continue to incur charges."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MANAGEMENT_STATION_ENABLED" == "true" ]]; then
            {
              echo
              echo "> **Warning: management station enabled.** The private Dev management station and its RDP firewall rules are configured to remain after worker teardown and continue to incur GCP charges until disabled or deleted."
              echo
              echo "The station has no public URL. Start an IAP tunnel, then connect an RDP client to \`localhost:3389\`: "
              echo
              echo '```bash'
              echo "gcloud compute start-iap-tunnel dev-iis-demo-management 3389 --local-host-port=localhost:3389 --project=${GCP_PROJECT_ID} --zone=${GCP_ZONE}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Management station:** Disabled; no persistent station is configured." >> "$GITHUB_STEP_SUMMARY"
          fi

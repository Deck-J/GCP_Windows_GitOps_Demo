name: Reconcile production blue-green state

# A reviewed manifest change triggers Cloud Build. The runtime is deliberately temporary:
# it is validated, displayed, and removed after the viewing window.
on:
  push:
    branches: [main]
    paths:
      - environments/prod/deployment.env
      - framework/deploy/**
      - integrations/dynatrace/**
      - pipelines/cloudbuild-deploy.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-blue-green
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 1/5 Checkout reviewed desired state
        uses: actions/checkout@v4

      - name: Check required repository configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -Eeuo pipefail
          missing=()
          for name in GCP_PROJECT_ID GCP_ZONE GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub repository variables: %s\n' "${missing[*]}" >&2
            printf 'Run the one-time administrator bootstrap, then rerun this workflow.\n' >&2
            exit 1
          fi

      - name: 2/5 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: 3/5 Configure Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 4/5 Deploy, validate, display and tear down demo
        shell: bash
        run: |
          # Cloud Build owns resource creation and cleanup; this job records the public result in its summary.
          set -Eeuo pipefail
          # shellcheck disable=SC1091
          source environments/prod/deployment.env

          echo "::group::Cloud Build - blue/green deployment and automatic teardown"
          set +e
          gcloud builds submit \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --config=pipelines/cloudbuild-deploy.yaml \
            --substitutions="_ZONE=${{ vars.GCP_ZONE }},_DYNATRACE_ENABLED=${{ vars.DYNATRACE_ENABLED || 'false' }},_DYNATRACE_ENVIRONMENT_URL=${{ vars.DYNATRACE_ENVIRONMENT_URL || 'disabled' }},_DYNATRACE_TOKEN_SECRET=${{ vars.DYNATRACE_TOKEN_SECRET || 'disabled' }},_DYNATRACE_RUNTIME_SERVICE_ACCOUNT=${{ vars.DYNATRACE_RUNTIME_SERVICE_ACCOUNT || 'disabled' }},_DYNATRACE_MONITORING_MODE=${{ vars.DYNATRACE_MONITORING_MODE || 'fullstack' }},_DYNATRACE_HOST_GROUP=${{ vars.DYNATRACE_HOST_GROUP || 'gcp-windows-demo' }},_DYNATRACE_NETWORK_ZONE=${{ vars.DYNATRACE_NETWORK_ZONE || 'disabled' }}" \
            . 2>&1 | tee cloud-build-deploy.log
          DEPLOY_STATUS=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"

          PUBLIC_URL="$(sed -n 's/.*PUBLIC_URL=//p' cloud-build-deploy.log | tail -1 | tr -d '\r')"
          TEARDOWN_STATUS="$(sed -n 's/.*DEMO_TEARDOWN_STATUS=//p' cloud-build-deploy.log | tail -1 | tr -d '\r')"
          DYNATRACE_STATUS="$(sed -n 's/.*DYNATRACE_STATUS=//p' cloud-build-deploy.log | tail -1 | tr -d '\r')"
          [[ -n "$PUBLIC_URL" ]] || PUBLIC_URL='Not published'
          [[ -n "$TEARDOWN_STATUS" ]] || TEARDOWN_STATUS='Unknown'
          [[ -n "$DYNATRACE_STATUS" ]] || DYNATRACE_STATUS='Unknown'
          if [[ "$DEPLOY_STATUS" -eq 0 ]]; then RESULT='Passed'; else RESULT='Failed'; fi

          {
            echo '## Blue/green demonstration'
            echo
            echo '| Item | Result |'
            echo '| --- | --- |'
            echo "| Overall result | ${RESULT} |"
            echo "| Requested color | ${ACTIVE_COLOR} |"
            echo "| Application version | $([[ "$ACTIVE_COLOR" == blue ]] && echo "$BLUE_VERSION" || echo "$GREEN_VERSION") |"
            echo "| Validation URL | ${PUBLIC_URL} |"
            echo '| Viewing window | 10 minutes |'
            echo "| Dynatrace OneAgent | ${DYNATRACE_STATUS} |"
            echo "| Runtime teardown | ${TEARDOWN_STATUS} |"
            echo
            echo '_The validation URL is intentionally removed when the viewing window ends._'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_STATUS" -ne 0 ]]; then
            echo "::error title=Blue/green demo failed::Validation or teardown failed. Runtime cleanup was attempted before this result was returned."
            exit "$DEPLOY_STATUS"
          fi
          echo "::notice title=Demo complete::Application validation passed and runtime teardown completed."

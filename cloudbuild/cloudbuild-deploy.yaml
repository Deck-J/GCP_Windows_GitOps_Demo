# Deployment entry point submitted by the Dev or Prod GitHub Actions workflow.
# The wrapper validates the selected manifest, exposes the deployment for a
# viewing window, and attempts worker teardown while preserving failures.
# Keep this timeout longer than the maximum viewing window plus deployment/cleanup time.
timeout: 3600s

steps:
  - id: run-validate-and-teardown-demo
    # Cloud SDK supplies gcloud; the repository script owns the deployment lifecycle.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - infrastructure/deployment/run-demo.sh
      - $PROJECT_ID
      - ${_ZONE}
      - ${_APP_NAME}
      - ${_TEARDOWN_DELAY_SECONDS}
      - ${_DYNATRACE_ENABLED}
      - ${_DYNATRACE_ENVIRONMENT_URL}
      - ${_DYNATRACE_TOKEN_SECRET}
      - ${_DYNATRACE_RUNTIME_SERVICE_ACCOUNT}
      - ${_DYNATRACE_MONITORING_MODE}
      - ${_DYNATRACE_HOST_GROUP}
      - ${_DYNATRACE_NETWORK_ZONE}
      - ${_DEPLOYMENT_MANIFEST}
      # Optional persistent station flag; false leaves no management VM or RDP rules.
      - ${_MANAGEMENT_STATION_ENABLED}

# Defaults support manual gcloud submission; GitHub Actions overrides the
# environment-specific values and forwards repository variables explicitly.
substitutions:
  _ZONE: us-central1-a
  _APP_NAME: prod-iis-demo
  _DEPLOYMENT_MANIFEST: environments/prod/deployment.env
  _TEARDOWN_DELAY_SECONDS: "600"
  _DYNATRACE_ENABLED: "false"
  _DYNATRACE_ENVIRONMENT_URL: "disabled"
  _DYNATRACE_TOKEN_SECRET: "disabled"
  _DYNATRACE_RUNTIME_SERVICE_ACCOUNT: "disabled"
  _DYNATRACE_MONITORING_MODE: "fullstack"
  _DYNATRACE_HOST_GROUP: "gcp-windows-demo"
  _DYNATRACE_NETWORK_ZONE: "disabled"
  _MANAGEMENT_STATION_ENABLED: "false"

options:
  # All detailed build output is retained in Cloud Logging.
  logging: CLOUD_LOGGING_ONLY
